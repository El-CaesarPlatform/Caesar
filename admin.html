<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم - إدارة الطلاب والامتحانات</title>

    <!-- خط تجوال من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- مكتبات الفايربيس الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* القائمة الرئيسية العلوية */
        .main-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .main-nav button {
            flex: 1;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .main-nav button:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
        }

        .main-nav button.active {
            background: var(--primary);
            color: var(--bg-main);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 20px 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 800;
        }

        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-box input, .form-input, select, textarea {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #0b1121;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus, .form-input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active, .tab-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }

        .badge-count {
            background: var(--primary);
            color: var(--bg-main);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* شبكة الكروت */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .student-card, .exam-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .student-card:hover, .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: #475569;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .student-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
        }

        .badges-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        .section-block {
            background: #0b1121;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .info-item { font-size: 1rem; color: var(--text-muted); }
        .info-item strong { color: #cbd5e1; }
        .highlight-text { color: var(--primary); font-weight: bold; }

        .score-box-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .score-input {
            width: 65px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid var(--primary);
            background: #0f172a;
            color: #fff;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .btn-save-score {
            background: var(--success);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn-save-score:hover { background: #059669; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .btn:hover { filter: brightness(1.1); transform: scale(0.98); }

        .btn-accept { background: var(--success); color: white; }
        .btn-reject { background: var(--danger); color: white; }
        .btn-show-score { background: #4f46e5; color: white; }
        .btn-hide-score { background: #64748b; color: white; }
        .btn-reset { background: var(--warning); color: #000; }
        .btn-delete { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }
        .btn-view { background: var(--primary); color: var(--bg-main); grid-column: span 2; }
        
        .btn-add-q { background: var(--success); color: white; width: auto; margin-bottom: 20px; }

        /* أقسام الامتحانات */
        #exam-creation-section, #published-exams-section { display: none; }

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .remove-q-btn { background: var(--danger); color: white; padding: 8px 15px; border:none; border-radius: 8px; cursor: pointer; font-weight: bold;}

        /* نافذة الإجابات (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .close-btn {
            position: absolute;
            left: 20px; top: 20px;
            font-size: 2rem;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
        }
        .close-btn:hover { color: var(--danger); }
        
        .ans-card {
            background: #0b1121;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }
        .ans-correct { color: var(--success); font-weight: bold; font-size: 1.1rem; }
        .ans-wrong { color: var(--danger); font-weight: bold; font-size: 1.1rem; }
        .ans-essay { color: var(--warning); font-weight: bold; font-size: 1.1rem; }
        .question-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin: 10px 0; border: 1px solid var(--border-color); object-fit: contain; }
    </style>
</head>
<body>

<div class="container">

    <!-- القائمة الرئيسية -->
    <div class="main-nav">
        <button id="nav-students" class="active" onclick="switchSection('students')">👥 إدارة الطلاب والنتائج</button>
        <button id="nav-exams" onclick="switchSection('exams')">📝 إنشاء امتحان جديد</button>
        <button id="nav-published-exams" onclick="switchSection('published-exams')">📚 الامتحانات المنشورة</button>
    </div>

    <!-- ============================================== -->
    <!-- القسم الأول: إدارة الطلاب وإجاباتهم -->
    <!-- ============================================== -->
    <div id="students-section">
        <header>
            <h1>🛠️ إدارة الطلاب والنتائج التفصيلية</h1>
            <span id="total-count" style="color: var(--text-muted); font-size: 1.1rem; font-weight: bold;">إجمالي الطلاب: 0</span>
        </header>

        <!-- نموذج إضافة طالب جديد -->
        <div class="section-block" style="margin-bottom: 25px;">
            <button class="btn btn-add-q" onclick="toggleAddStudentForm()" style="margin-bottom:0;">➕ إضافة طالب يدوياً</button>
            
            <div id="add-student-form" style="display: none; margin-top: 15px; flex-direction: column; gap: 15px;">
                <h3 style="color:var(--primary);">بيانات الطالب الجديد:</h3>
                <div class="info-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
                    <div>
                        <label style="color:var(--text-muted); display:block; margin-bottom:8px;">اسم الطالب الثلاثي:</label>
                        <input type="text" id="new-student-name" class="form-input" placeholder="مثال: أحمد محمد علي">
                    </div>
                    <div>
                        <label style="color:var(--text-muted); display:block; margin-bottom:8px;">الصف الدراسي:</label>
                        <select id="new-student-grade">
                            <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                            <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                            <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                        </select>
                    </div>
                    <div>
                        <label style="color:var(--text-muted); display:block; margin-bottom:8px;">كود الطالب (كلمة المرور):</label>
                        <input type="text" id="new-student-code" class="form-input" placeholder="مثال: 102030">
                    </div>
                </div>
                <button class="btn btn-accept" onclick="saveNewStudent()" style="width: max-content; padding: 12px 30px;">💾 حفظ وتسجيل الطالب</button>
            </div>
        </div>

        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="🔍 ابحث باسم الطالب، الصف، الكود، أو اسم الامتحان...">
            </div>

            <div class="filter-tabs">
                <button class="tab-btn active" onclick="setFilterStatus('all_approved', this)">✅ الطلاب المقبولين</button>
                <button class="tab-btn" onclick="setFilterStatus('exam_results', this)">📊 من أتموا الامتحان <span class="badge-count" id="exams-count">0</span></button>
                <button class="tab-btn" onclick="setFilterStatus('all', this)">🌐 عرض الكل</button>
            </div>
        </div>

        <div class="grid-container" id="cards-container">
            <p style="text-align: center; color: var(--text-muted); width: 100%;">⏳ جاري تحميل البيانات...</p>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- القسم الثاني: قسم إضافة الامتحانات مع الصور والمقالي -->
    <!-- ============================================== -->
    <div id="exam-creation-section">
        <header>
            <h1>📝 إنشاء امتحان جديد (اختياري + مقالي + صور)</h1>
        </header>

        <div class="section-block" style="margin-bottom: 25px;">
            <div class="info-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
                <div>
                    <label style="color: var(--text-muted); margin-bottom: 8px; display: block;">اختر الصف الدراسي:</label>
                    <select id="exam-grade">
                        <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                        <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                        <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                    </select>
                </div>
                <div>
                    <label style="color: var(--text-muted); margin-bottom: 8px; display: block;">عنوان / اسم الامتحان:</label>
                    <input type="text" id="exam-code" class="form-input" placeholder="مثال: جغرافيا - شهر أكتوبر">
                </div>
                <div>
                    <label style="color: var(--text-muted); margin-bottom: 8px; display: block;">⏱️ مدة الامتحان (بالدقائق):</label>
                    <input type="number" id="exam-duration" class="form-input" value="30" min="1" placeholder="مثال: 30">
                </div>
            </div>
        </div>

        <div id="questions-container"></div>

        <button class="btn btn-add-q" onclick="addQuestionUI()">➕ إضافة سؤال جديد</button>
        <button class="btn" style="background: var(--primary); color: var(--bg-main); width: 100%; padding: 15px; font-size: 1.2rem;" onclick="saveExamToFirebase()">💾 حفظ الامتحان ونشره</button>
    </div>

    <!-- ============================================== -->
    <!-- القسم الثالث: الامتحانات المنشورة -->
    <!-- ============================================== -->
    <div id="published-exams-section">
        <header>
            <h1>📚 الامتحانات المنشورة</h1>
        </header>
        <div class="grid-container" id="exams-container">
            <p style="text-align: center; color: var(--text-muted); width: 100%;">⏳ جاري تحميل الامتحانات...</p>
        </div>
    </div>

</div>

<!-- نافذة عارض إجابات الطالب (Modal) -->
<div id="student-answers-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAnswersModal()">&times;</span>
        <h2 id="modal-student-title" style="color: var(--primary); margin-bottom: 5px;">📑 إجابات الطالب</h2>
        <h4 id="modal-exam-title" style="color: var(--text-muted); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;"></h4>
        <div id="modal-answers-body"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. تهيئة Firebase
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDSaHZfMovOtZVkv5HDtfsy4Kh_ttszSLI",
        authDomain: "el-kaiser-platform.firebaseapp.com",
        projectId: "el-kaiser-platform",
        storageBucket: "el-kaiser-platform.firebasestorage.app",
        messagingSenderId: "639617459641",
        appId: "1:639617459641:web:7804a357079b1b559c4268"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ==========================================
    // 2. التنقل بين الأقسام
    // ==========================================
    function switchSection(section) {
        document.getElementById('nav-students').classList.remove('active');
        document.getElementById('nav-exams').classList.remove('active');
        document.getElementById('nav-published-exams').classList.remove('active');

        document.getElementById('students-section').style.display = 'none';
        document.getElementById('exam-creation-section').style.display = 'none';
        document.getElementById('published-exams-section').style.display = 'none';

        if(section === 'students') {
            document.getElementById('nav-students').classList.add('active');
            document.getElementById('students-section').style.display = 'block';
        } else if(section === 'exams') {
            document.getElementById('nav-exams').classList.add('active');
            document.getElementById('exam-creation-section').style.display = 'block';
            if(document.getElementById('questions-container').children.length === 0) {
                addQuestionUI();
            }
        } else if(section === 'published-exams') {
            document.getElementById('nav-published-exams').classList.add('active');
            document.getElementById('published-exams-section').style.display = 'block';
            fetchPublishedExams();
        }
    }

    // ==========================================
    // 3. إدارة وإضافة الطلاب
    // ==========================================
    function toggleAddStudentForm() {
        const form = document.getElementById('add-student-form');
        form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'flex' : 'none';
    }

    function saveNewStudent() {
        const name = document.getElementById('new-student-name').value.trim();
        const grade = document.getElementById('new-student-grade').value;
        const code = document.getElementById('new-student-code').value.trim();

        if(!name || !code) {
            alert("يرجى إدخال اسم الطالب والكود!");
            return;
        }

        const studentData = {
            studentName: name,
            grade: grade,
            code: code,
            password: code,
            accountStatus: "approved",
            isApproved: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        db.collection("students").add(studentData).then(() => {
            alert("✅ تم إضافة الطالب بنجاح!");
            document.getElementById('new-student-name').value = '';
            document.getElementById('new-student-code').value = '';
            toggleAddStudentForm();
        }).catch(err => alert("❌ حدث خطأ: " + err.message));
    }

    // ==========================================
    // 4. جلب الطلاب وعرض الكروت
    // ==========================================
    let allStudentsData = [];
    let currentStatusFilter = 'all_approved'; 

    db.collection("students").onSnapshot((snapshot) => {
        allStudentsData = [];
        snapshot.forEach((doc) => {
            allStudentsData.push({ id: doc.id, ...doc.data() });
        });
        updateCounters();
        applyFilters();
    });

    function updateCounters() {
        document.getElementById("total-count").innerText = `إجمالي الطلاب: ${allStudentsData.length}`;
        const examsNum = allStudentsData.filter(item => isExamTaken(item)).length;
        document.getElementById("exams-count").innerText = examsNum;
    }

    function isExamTaken(item) {
        return !!(item.answers || item.score !== undefined || item.finalScore !== undefined || item.hasSubmitted || item.isSubmitted || item.isCompleted);
    }

    function getAccountStatus(item) {
        if (item.accountStatus) return item.accountStatus;
        return item.isApproved !== undefined ? (item.isApproved ? 'approved' : 'pending') : 'pending';
    }

    function setFilterStatus(status, btnElement) {
        currentStatusFilter = status;
        document.querySelectorAll('#students-section .filter-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        applyFilters();
    }

    function applyFilters() {
        const searchTxt = document.getElementById("search-input").value.toLowerCase().trim();

        const filtered = allStudentsData.filter(item => {
            const accStatus = getAccountStatus(item);
            const hasExam = isExamTaken(item);

            let matchesTab = true;
            if (currentStatusFilter === 'all_approved') matchesTab = (accStatus === 'approved');
            else if (currentStatusFilter === 'exam_results') matchesTab = hasExam;

            const name = (item.studentName || item.name || "").toLowerCase();
            const grade = (item.grade || item.studentGrade || "").toLowerCase();
            const code = (item.code || item.password || item.studentPhone || "").toLowerCase();
            const examName = (item.examName || item.examTitle || item.title || item.examCode || item.subject || "").toLowerCase();

            return matchesTab && (name.includes(searchTxt) || grade.includes(searchTxt) || code.includes(searchTxt) || examName.includes(searchTxt));
        });

        renderCards(filtered);
    }

    function renderCards(data) {
        const container = document.getElementById("cards-container");
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color:var(--text-muted);">لا توجد بيانات مطابقة.</p>`;
            return;
        }

        data.forEach(item => {
            let accountStatus = getAccountStatus(item);
            const isScoreShown = (item.showScore === true || item.showResult === true || item.isResultVisible === true);
            const hasExam = isExamTaken(item);
            const hasAnswers = item.answers && (Array.isArray(item.answers) ? item.answers.length > 0 : Object.keys(item.answers).length > 0);

            let accountBadgeHTML = accountStatus === 'approved' 
                ? `<span class="badge badge-approved">مقبول ✅</span>` 
                : (accountStatus === 'rejected' ? `<span class="badge badge-rejected">مرفوض ❌</span>` : `<span class="badge badge-pending">قيد المراجعة ⏳</span>`);

            const studentName = item.studentName || item.name || "طالب بدون اسم";
            const studentGrade = item.grade || item.studentGrade || "غير محدد";
            const studentCode = item.code || item.password || item.studentPhone || "غير محدد";
            
            const examNameDisplay = item.examName || item.examTitle || item.title || item.examCode || item.subject || "غير مسجل";
            
            const currentScoreValue = (item.finalScore !== undefined) ? item.finalScore : ((item.score !== undefined) ? item.score : 0);
            const maxScoreValue = (item.maxScore !== undefined) ? item.maxScore : ((item.maxExamScore !== undefined) ? item.maxExamScore : 10);

            let scoreHTML = `<span style="color:var(--danger); font-weight:bold;">لم يمتحن بعد</span>`;

            if (hasExam) {
                scoreHTML = `
                    <div class="score-box-container">
                        <input type="number" id="manual-score-${item.id}" value="${currentScoreValue}" class="score-input" title="درجة الطالب">
                        <span style="color:var(--text-muted); font-weight:bold;"> من </span>
                        <input type="number" id="manual-max-score-${item.id}" value="${maxScoreValue}" class="score-input" title="الدرجة الكلية">
                        <button class="btn-save-score" onclick="saveManualScore('${item.id}')">حفظ 💾</button>
                    </div>
                `;
            }

            const card = document.createElement("div");
            card.className = "student-card";
            card.innerHTML = `
                <div class="card-header">
                    <span class="student-name">👤 ${studentName}</span>
                    <div class="badges-container">
                        ${accountBadgeHTML}
                        ${hasExam ? (isScoreShown ? `<span class="badge badge-approved">النتيجة: ظاهرة</span>` : `<span class="badge badge-pending">النتيجة: مخفية</span>`) : ''}
                    </div>
                </div>

                <div class="section-block">
                    <div class="info-grid">
                        <div class="info-item"><strong>📚 الصف:</strong> ${studentGrade}</div>
                        <div class="info-item"><strong>🔑 الكود / المرور:</strong> <span class="highlight-text">${studentCode}</span></div>
                        <div class="info-item"><strong>📝 اسم الامتحان:</strong> <span style="color:#fcd34d; font-weight:bold;">${hasExam ? examNameDisplay : '-'}</span></div>
                        <div class="info-item"><strong>🎯 الدرجة والتعديل:</strong> ${scoreHTML}</div>
                    </div>
                </div>

                <div class="btn-row">
                    ${hasAnswers ? `<button class="btn btn-view" onclick="showStudentAnswers('${item.id}')">👁️ عرض الإجابات والأسئلة المقالية</button>` : ''}
                    ${accountStatus !== 'approved' ? `<button class="btn btn-accept" onclick="updateStudent('${item.id}', {accountStatus:'approved', isApproved:true})">✅ قبول</button>` : ''}
                    ${accountStatus !== 'rejected' ? `<button class="btn btn-reject" onclick="updateStudent('${item.id}', {accountStatus:'rejected', isApproved:false})">❌ رفض</button>` : ''}
                    ${hasExam ? (isScoreShown 
                        ? `<button class="btn btn-hide-score" onclick="toggleResultVisibility('${item.id}', false)">🔒 إخفاء النتيجة</button>`
                        : `<button class="btn btn-show-score" onclick="toggleResultVisibility('${item.id}', true)">👁️ إظهار النتيجة</button>`
                    ) : ''}
                    ${hasExam ? `<button class="btn btn-reset" onclick="resetStudentExam('${item.id}')">🔄 إعادة الامتحان</button>` : ''}
                    <button class="btn btn-delete" onclick="deleteStudent('${item.id}')">🗑️ حذف الطالب</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ==========================================
    // 5. حفظ الدرجة يدوياً
    // ==========================================
    function saveManualScore(studentId) {
        const scoreInput = document.getElementById(`manual-score-${studentId}`);
        const maxScoreInput = document.getElementById(`manual-max-score-${studentId}`);
        if (!scoreInput || !maxScoreInput) return;

        const newScore = parseFloat(scoreInput.value);
        const newMaxScore = parseFloat(maxScoreInput.value);

        if (isNaN(newScore) || isNaN(newMaxScore)) {
            alert("⚠️ يرجى أدخال أرقام صحيحة لدرجة الطالب والدرجة الكلية!");
            return;
        }

        db.collection("students").doc(studentId).update({
            score: newScore,
            finalScore: newScore,
            maxScore: newMaxScore,
            maxExamScore: newMaxScore,
            isGraded: true
        }).then(() => {
            alert(`✅ تم حفظ الدرجة بنجاح: (${newScore} من ${newMaxScore})`);
        }).catch(err => alert("❌ حدث خطأ أثناء حفظ الدرجة: " + err.message));
    }

    // ==========================================
    // 6. التحديث والتغيير وإعادة الامتحان الشاملة
    // ==========================================
    function updateStudent(studentId, data) {
        db.collection("students").doc(studentId).update(data)
            .then(() => alert("✅ تم تحديث حالة الطالب بنجاح!"))
            .catch(err => alert("❌ حدث خطأ: " + err.message));
    }

    function toggleResultVisibility(studentId, show) {
        db.collection("students").doc(studentId).update({
            showScore: show,
            showResult: show,
            isResultVisible: show
        }).then(() => {
            alert(show ? "✅ تم إظهار النتيجة للطالب بنجاح!" : "🔒 تم إخفاء النتيجة عن الطالب!");
        }).catch(err => alert("❌ حدث خطأ أثناء التحديث: " + err.message));
    }

    function deleteStudent(studentId) {
        if (!confirm("⚠️ هل أنت تأكد من حذف هذا الطالب نهائياً؟")) return;
        db.collection("students").doc(studentId).delete()
            .then(() => alert("🗑️ تم حذف حساب الطالب بنجاح!"))
            .catch(err => alert("❌ حدث خطأ أثناء الحذف: " + err.message));
    }

    // 🔥🔥 دالة إعادة الامتحان المحسّنة بالكامل 🔥🔥
    function resetStudentExam(studentId) {
        if (!confirm("⚠️ هل أنت تأكد من إعادة الامتحان لهذا الطالب؟ سيتم مسح كافة البيانات السابقة ليتسنى له الدخول من جديد.")) return;

        db.collection("students").doc(studentId).update({
            // مسح جميع حالات التسليم المحتملة
            hasSubmitted: false,
            isSubmitted: false,
            isCompleted: false,
            examStarted: false,
            
            // مسح بيانات الإجابات والدرجات بالكامل
            answers: firebase.firestore.FieldValue.delete(),
            score: firebase.firestore.FieldValue.delete(),
            finalScore: firebase.firestore.FieldValue.delete(),
            maxScore: firebase.firestore.FieldValue.delete(),
            maxExamScore: firebase.firestore.FieldValue.delete(),
            showScore: false,
            showResult: false,
            isResultVisible: false,
            isGraded: false,
            
            // مسح التواريخ والمعرفات وأسماء الامتحانات المسجلة للطالب
            submittedAt: firebase.firestore.FieldValue.delete(),
            examId: firebase.firestore.FieldValue.delete(),
            examTitle: firebase.firestore.FieldValue.delete(),
            examName: firebase.firestore.FieldValue.delete(),
            submittedExams: firebase.firestore.FieldValue.delete()
        }).then(() => {
            alert("✅ تم إعادة تعيين الامتحان بنجاح ومسح كل السجلات القديمة!\n\n💡 ملاحظة: يرجى إبلاغ الطالب بطلب عمل (Refresh / تحديث) للصفحة أو تسجيل الخروج والدخول مجدداً ليظهر له زر الامتحان 🚀");
        }).catch(err => alert("❌ حدث خطأ أثناء إعادة الامتحان: " + err.message));
    }

    // ==========================================
    // 7. عرض إجابات الطالب في النافذة المنبثقة Modal
    // ==========================================
    function showStudentAnswers(studentId) {
        const student = allStudentsData.find(s => s.id === studentId);
        if (!student || !student.answers) {
            alert("لا توجد تفاصيل إجابات مسجلة لهذا الطالب!");
            return;
        }

        const modal = document.getElementById("student-answers-modal");
        const titleEl = document.getElementById("modal-student-title");
        const examTitleEl = document.getElementById("modal-exam-title");
        const bodyEl = document.getElementById("modal-answers-body");

        const examNameDisplay = student.examName || student.examTitle || student.title || student.examCode || student.subject || "امتحان بدون عنوان";
        const currentScore = (student.finalScore !== undefined) ? student.finalScore : (student.score || 0);
        const maxScore = (student.maxScore !== undefined) ? student.maxScore : 10;

        titleEl.innerText = `👤 إجابات الطالب: ${student.studentName || student.name}`;
        examTitleEl.innerText = `📝 الامتحان: ${examNameDisplay} | الدرجة الحالية: ${currentScore} من ${maxScore}`;
        bodyEl.innerHTML = "";

        let answersArr = [];
        if (Array.isArray(student.answers)) {
            answersArr = student.answers;
        } else if (typeof student.answers === 'object') {
            answersArr = Object.values(student.answers);
        }

        if(answersArr.length === 0) {
            bodyEl.innerHTML = "<p style='color:var(--text-muted);'>لا توجد إجابات محفوظة لتتم عرضها.</p>";
        } else {
            answersArr.forEach((ans, idx) => {
                const ansCard = document.createElement('div');
                ansCard.className = 'ans-card';

                const questionText = ans.question || ans.questionText || `سؤال رقم (${idx + 1})`;
                const studentAns = ans.studentAnswer || ans.userAnswer || ans.answer || "لم يجب الطالب";
                const correctAns = ans.correctAnswer || ans.correctAns || "";
                const isEssay = ans.type === "essay" || !correctAns;

                let imgHTML = ans.imageUrl ? `<img src="${ans.imageUrl}" class="question-img" alt="صورة السؤال">` : '';

                let statusHTML = '';
                if (isEssay) {
                    statusHTML = `<span class="ans-essay">📝 سؤال مقالي</span>`;
                } else if (studentAns.trim() === correctAns.trim()) {
                    statusHTML = `<span class="ans-correct">✅ إجابة صحيحة</span>`;
                } else {
                    statusHTML = `<span class="ans-wrong">❌ إجابة خاطئة (الإجابة الصحيحة: ${correctAns})</span>`;
                }

                ansCard.innerHTML = `
                    <h3 style="color:#fff; margin-bottom:8px;">س${idx + 1}: ${questionText}</h3>
                    ${imgHTML}
                    <p style="color:var(--text-muted); margin: 6px 0;"><strong>إجابة الطالب:</strong> <span style="color:#fff; font-weight:bold;">${studentAns}</span></p>
                    <div>${statusHTML}</div>
                `;
                bodyEl.appendChild(ansCard);
            });
        }

        modal.style.display = "flex";
    }

    function closeAnswersModal() {
        document.getElementById("student-answers-modal").style.display = "none";
    }

    // ==========================================
    // 8. بناء واجهة الأسئلة عند الإنشاء
    // ==========================================
    let questionCounter = 0;

    function addQuestionUI() {
        questionCounter++;
        const container = document.getElementById("questions-container");

        const qCard = document.createElement("div");
        qCard.className = "question-card";
        qCard.id = `q-card-${questionCounter}`;

        qCard.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:var(--primary);">السؤال رقم ${questionCounter}</h3>
                <button class="remove-q-btn" onclick="removeQuestion('${qCard.id}')">🗑️ حذف السؤال</button>
            </div>

            <div class="info-grid" style="grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:15px;">
                <div>
                    <label style="color:var(--text-muted); display:block; margin-bottom:5px;">نوع السؤال:</label>
                    <select class="q-type" onchange="toggleQuestionType('${qCard.id}', this.value)">
                        <option value="choice">اختيار من متعدد (MCQ)</option>
                        <option value="essay">سؤال مقالي (كتابة)</option>
                    </select>
                </div>
                <div>
                    <label style="color:var(--text-muted); display:block; margin-bottom:5px;">رابط صورة (اختياري):</label>
                    <input type="text" class="q-image" placeholder="https://..." class="form-input">
                </div>
                <div>
                    <label style="color:var(--text-muted); display:block; margin-bottom:5px;">درجة السؤال:</label>
                    <input type="number" class="q-points" value="1" min="1" class="form-input">
                </div>
            </div>

            <div style="margin-bottom:15px;">
                <label style="color:var(--text-muted); display:block; margin-bottom:5px;">نص السؤال:</label>
                <textarea class="q-text" rows="2" placeholder="اكتب نص السؤال هنا..."></textarea>
            </div>

            <div class="mcq-options-container">
                <label style="color:var(--text-muted); display:block;">الخيارات وموقع الإجابة الصحيحة:</label>
                <div class="options-grid">
                    <input type="text" class="q-opt opt-0" placeholder="الخيار الأول">
                    <input type="text" class="q-opt opt-1" placeholder="الخيار الثاني">
                    <input type="text" class="q-opt opt-2" placeholder="الخيار الثالث">
                    <input type="text" class="q-opt opt-3" placeholder="الخيار الرابع">
                </div>
                <div style="margin-top:12px;">
                    <label style="color:var(--primary); font-weight:bold;">حدد الإجابة الصحيحة:</label>
                    <select class="q-correct-index" style="margin-top:5px;">
                        <option value="0">الخيار الأول</option>
                        <option value="1">الخيار الثاني</option>
                        <option value="2">الخيار الثالث</option>
                        <option value="3">الخيار الرابع</option>
                    </select>
                </div>
            </div>
        `;

        container.appendChild(qCard);
    }

    function removeQuestion(cardId) {
        const card = document.getElementById(cardId);
        if (card) card.remove();
    }

    function toggleQuestionType(cardId, type) {
        const card = document.getElementById(cardId);
        const optionsBox = card.querySelector('.mcq-options-container');
        if (type === 'essay') {
            optionsBox.style.display = 'none';
        } else {
            optionsBox.style.display = 'block';
        }
    }

    // ==========================================
    // 9. حفظ الامتحان إلى الفايربيس
    // ==========================================
    function saveExamToFirebase() {
        const grade = document.getElementById("exam-grade").value;
        const examTitle = document.getElementById("exam-code").value.trim();
        const duration = parseInt(document.getElementById("exam-duration").value) || 30;

        if (!examTitle) {
            alert("⚠️ يرجى أدخال عنوان للامتحان!");
            return;
        }

        const qCards = document.querySelectorAll(".question-card");
        if (qCards.length === 0) {
            alert("⚠️ يرجى إضافة سؤال واحد على الأقل!");
            return;
        }

        let questions = [];
        let totalExamPoints = 0;

        for (let i = 0; i < qCards.length; i++) {
            const card = qCards[i];
            const type = card.querySelector(".q-type").value;
            const text = card.querySelector(".q-text").value.trim();
            const imageUrl = card.querySelector(".q-image").value.trim();
            const points = parseFloat(card.querySelector(".q-points").value) || 1;

            if (!text) {
                alert(`⚠️ السؤال رقم ${i + 1} بدون نص!`);
                return;
            }

            let qObj = {
                type: type,
                question: text,
                imageUrl: imageUrl,
                points: points
            };

            if (type === "choice") {
                const opt0 = card.querySelector(".opt-0").value.trim();
                const opt1 = card.querySelector(".opt-1").value.trim();
                const opt2 = card.querySelector(".opt-2").value.trim();
                const opt3 = card.querySelector(".opt-3").value.trim();
                const correctIdx = parseInt(card.querySelector(".q-correct-index").value);

                if (!opt0 || !opt1) {
                    alert(`⚠️ السؤال رقم ${i + 1} يحتاج إلى خيارين على الأقل!`);
                    return;
                }

                const optionsArr = [opt0, opt1, opt2, opt3].filter(o => o !== "");
                qObj.options = optionsArr;
                qObj.correctAnswerIndex = correctIdx;
                qObj.correctAnswer = optionsArr[correctIdx] || optionsArr[0];
            }

            totalExamPoints += points;
            questions.push(qObj);
        }

        const examData = {
            grade: grade,
            examCode: examTitle,
            title: examTitle,
            duration: duration,
            durationMinutes: duration,
            questions: questions,
            totalPoints: totalExamPoints,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        db.collection("exams").add(examData).then(() => {
            alert(`✅ تم نشر الامتحان بنجاح بمدة (${duration} دقيقة)!`);
            document.getElementById("exam-code").value = "";
            document.getElementById("questions-container").innerHTML = "";
            switchSection("published-exams");
        }).catch(err => alert("❌ حدث خطأ أثناء حفظ الامتحان: " + err.message));
    }

    // ==========================================
    // 10. عرض وحذف الامتحانات المنشورة
    // ==========================================
    function fetchPublishedExams() {
        const container = document.getElementById("exams-container");
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); width: 100%;">⏳ جاري تحميل الامتحانات...</p>`;

        db.collection("exams").get().then((snapshot) => {
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); width: 100%;">لا توجد امتحانات منشورة حالياً.</p>`;
                return;
            }

            snapshot.forEach(doc => {
                const exam = doc.data();
                const examId = doc.id;

                const card = document.createElement("div");
                card.className = "exam-card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="student-name" style="color:var(--primary);">📝 ${exam.title || exam.examCode}</span>
                        <span class="badge badge-approved">${exam.grade}</span>
                    </div>

                    <div class="section-block">
                        <div class="info-grid">
                            <div class="info-item"><strong>⏱️ مدة الامتحان:</strong> <span class="highlight-text">${exam.duration || exam.durationMinutes || 30} دقيقة</span></div>
                            <div class="info-item"><strong>❓ عدد الأسئلة:</strong> ${(exam.questions || []).length} أسئلة</div>
                            <div class="info-item"><strong>🎯 الدرجة الكلية:</strong> ${exam.totalPoints || (exam.questions || []).length} درجة</div>
                        </div>
                    </div>

                    <button class="btn btn-delete" onclick="deleteExam('${examId}')">🗑️ حذف الامتحان</button>
                `;
                container.appendChild(card);
            });
        }).catch(err => {
            container.innerHTML = `<p style="color:var(--danger); text-align:center;">❌ خطأ في التحميل: ${err.message}</p>`;
        });
    }

    function deleteExam(examId) {
        if (!confirm("⚠️ هل أنت تأكد من حذف هذا الامتحان؟")) return;
        db.collection("exams").doc(examId).delete().then(() => {
            alert("🗑️ تم حذف الامتحان بنجاح!");
            fetchPublishedExams();
        }).catch(err => alert("❌ حدث خطأ أثناء حذف الامتحان: " + err.message));
    }
</script>
</body>
</html>
