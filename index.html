<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة القيصر</title>

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b3a4b 0%, #0f2027 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 20px 0;
        }

        /* ------------------ شاشة التحميل الخاصة بـ (القيصر) ------------------ */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1b3a4b 0%, #0a151a 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: fadeIn 0.4s ease forwards;
        }

        .splash-logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الدائرة المضيئة التي تدور حول الكلمة */
        .splash-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #ffffff;
            border-right: 4px solid #00d2ff;
            animation: spinRing 1.2s linear infinite;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
        }

        /* دائرة خارجية خفيفة للتصميم */
        .splash-ring-outer {
            position: absolute;
            width: 125%;
            height: 125%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            animation: spinRingReverse 3s linear infinite;
        }

        .splash-text {
            color: #ffffff;
            font-size: 2.4rem;
            font-weight: 900;
            text-shadow: 0 0 18px #00d2ff, 0 0 30px rgba(0, 210, 255, 0.5);
            z-index: 2;
            letter-spacing: 1px;
            animation: pulseText 1.5s ease-in-out infinite alternate;
        }

        .splash-subtext {
            color: #e0f7fc;
            margin-top: 35px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes pulseText {
            from { transform: scale(0.98); opacity: 0.9; }
            to { transform: scale(1.04); opacity: 1; }
        }

        /* ------------------ الحاوية الرئيسية وتوسيط العناصر ------------------ */
        #hero {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ------------------ تصميم صورة المنصة ------------------ */
        .platform-img-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .platform-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .platform-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.7);
        }

        /* ------------------ شريط الأخبار ------------------ */
        .news-ticker {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 30px;
            padding: 10px 22px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: glowing-border 3s infinite ease-in-out;
        }

        .news-badge {
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            flex-shrink: 0;
        }

        .news-text {
            color: #e0f7fc;
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.5;
            text-align: right;
        }

        @keyframes glowing-border {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); border-color: rgba(0, 210, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); border-color: rgba(0, 210, 255, 0.8); }
        }

        /* ------------------ عنوان المنصة ------------------ */
        .brand-title {
            color: #fff;
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 22px;
            text-shadow: 0 4px 20px rgba(0, 210, 255, 0.25);
            letter-spacing: 0.5px;
            text-align: center;
        }

        .brand-title span {
            color: #00d2ff;
            background: linear-gradient(135deg, #00d2ff, #00d2ff);
            -webkit-background-clip: text;
        }

        /* ------------------ كارت تسجيل الدخول ------------------ */
        .login-container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 35px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow: 0 25px 60px rgba(0, 210, 255, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .form-header {
            color: #00d2ff;
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #custom-alert-msg {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            white-space: pre-line;
        }

        /* ------------------ الخانات والعناوين الفوقية ------------------ */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: right;
        }

        .input-label {
            display: block;
            color: #00d2ff;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            margin-right: 4px;
        }

        .input-label i {
            margin-left: 6px;
        }

        .login-container input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            outline: none;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: right;
        }

        .login-container input:focus {
            background-color: rgba(255, 255, 255, 0.12);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.35);
        }

        .login-container input::placeholder { color: #a0aec0; }
        
        #login-code { text-align: center; letter-spacing: 1px; }

        /* ------------------ زر الدخول ------------------ */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #0066ff 0%, #00d2ff 100%);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background: #4a5568;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ------------------ زر الواتساب ------------------ */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            border-radius: 35px;
            padding: 12px 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
            z-index: 100;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .whatsapp-float:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-float svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding-top: 20px; }
            .platform-img { width: 105px; height: 105px; }
            .brand-title { font-size: 1.8rem; }
            .news-ticker { flex-direction: column; text-align: center; gap: 8px; }
            .news-text { text-align: center; }
            .login-container { padding: 25px 18px; }
            .splash-logo-container { width: 140px; height: 140px; }
            .splash-text { font-size: 1.9rem; }
        }
    </style>
</head>
<body>

<!-- شاشة الانيميشن الخاصة بـ "القيصر" -->
<div id="splash-screen">
    <div class="splash-logo-container">
        <div class="splash-ring"></div>
        <div class="splash-ring-outer"></div>
        <div class="splash-text">القيصر</div>
    </div>
    <div class="splash-subtext" id="splash-user-welcome">جاري الدخول إلى المنصة...</div>
</div>

<div id="hero">
    <!-- مكان صورة المنصة المجهز -->
    <div class="platform-img-container">
        <img src="https://cdn.phototourl.com/free/2026-09-03-a833c58e-82ac-43f4-aae3-9e7a5b8c17b2.jpg" alt="شعار منصة القيصر" class="platform-img">
    </div>

    <div class="news-ticker">
        <span class="news-badge">📢 تنبيه</span>
        <span class="news-text">أدخل اسمك كما هو مسجل لدى المعلم والكود الخاص بك للدخول.</span>
    </div>

    <h1 class="brand-title">منصة <span>القيصر</span> التعليمية</h1>

    <div class="login-container">
        <div class="form-header">
            <i class="fas fa-user-graduate"></i>
            <span>تسجيل دخول الطالب</span>
        </div>

        <div id="custom-alert-msg"></div>

        <form id="login-form">
            <div class="input-group">
                <label for="login-name" class="input-label"><i class="fas fa-user"></i> الاسم الثلاثي للطالب</label>
                <input type="text" id="login-name" placeholder="اكتب اسمك كاملاً..." required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="login-code" class="input-label"><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="text" id="login-code" placeholder="أدخل كود الدخول..." required autocomplete="off">
            </div>
            
            <button type="submit" class="btn" id="login-btn">
                <span>دخول المنصة</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>
    </div>
</div>

<a href="https://wa.me/201150220788?text=مرحباً، أحتاج المساعدة في منصة القيصر." class="whatsapp-float" target="_blank" rel="noopener noreferrer">
    <span>الدعم الفني</span>
    <svg viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.742.002-2.602-1.01-5.05-2.85-6.892-1.84-1.842-4.29-2.856-6.896-2.858-5.442 0-9.866 4.372-9.746-.002 1.767.46 3.493 1.34 5.023l-.986 3.6 3.69-.968zm13.695-4.937c-.3-.149-1.777-.862-2.053-.962-.276-.1-.477-.149-.677.149-.199.299-.772.962-.947 1.16-.175.201-.35.226-.65.077-1.156-.573-1.928-1.012-2.693-2.316-.201-.341.201-.316.574-1.053.063-.125.032-.236-.016-.336-.048-.1-.477-1.136-.654-1.557-.172-.41-.347-.354-.477-.36l-.408-.008c-.141 0-.368.052-.56.26-.192.208-.733.706-.733 1.722 0 1.017.749 2.002.853 2.141.104.14 1.474 2.227 3.57 3.102.499.208.887.332 1.192.427.502.158.96.135 1.321.082.404-.06 1.777-.716 2.028-1.408.251-.692.251-1.284.175-1.408-.075-.124-.275-.199-.575-.349z"/>
    </svg>
</a>

<script>
    // ==========================================
    // 1. تهيئة Firebase
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDSaHZfMovOtZVkv5HDtfsy4Kh_ttszSLI",
        authDomain: "el-kaiser-platform.firebaseapp.com",
        projectId: "el-kaiser-platform",
        storageBucket: "el-kaiser-platform.firebasestorage.app",
        messagingSenderId: "639617459641",
        appId: "1:639617459641:web:7804a357079b1b559c4268"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function showMessage(text, type) {
        const msgBox = document.getElementById("custom-alert-msg");
        if (!msgBox) return;

        msgBox.innerText = text;
        msgBox.style.display = "block";

        if (type === "error") {
            msgBox.style.backgroundColor = "rgba(255, 0, 0, 0.2)";
            msgBox.style.color = "#ff6b6b";
            msgBox.style.border = "1px solid rgba(255, 0, 0, 0.4)";
        } else if (type === "success") {
            msgBox.style.backgroundColor = "rgba(0, 255, 100, 0.2)";
            msgBox.style.color = "#22c55e";
            msgBox.style.border = "1px solid rgba(0, 255, 100, 0.4)";
        } else if (type === "warning") {
            msgBox.style.backgroundColor = "rgba(234, 179, 8, 0.2)";
            msgBox.style.color = "#fde047";
            msgBox.style.border = "1px solid rgba(234, 179, 8, 0.4)";
        }
    }

    async function findStudentDoc(code) {
        let snapshot = await db.collection("students").where("examCode", "==", code).get();
        if (snapshot.empty) {
            snapshot = await db.collection("students").where("code", "==", code).get();
        }
        if (snapshot.empty) {
            snapshot = await db.collection("students").where("studentCode", "==", code).get();
        }

        if (snapshot.empty && !isNaN(code)) {
            const numericCode = Number(code);
            snapshot = await db.collection("students").where("examCode", "==", numericCode).get();
            if (snapshot.empty) {
                snapshot = await db.collection("students").where("code", "==", numericCode).get();
            }
            if (snapshot.empty) {
                snapshot = await db.collection("students").where("studentCode", "==", numericCode).get();
            }
        }
        return snapshot;
    }

    function resetButton(btn) {
        btn.disabled = false;
        btn.innerHTML = '<span>دخول المنصة</span> <i class="fas fa-sign-in-alt"></i>';
    }

    function proceedToLogin(name, stage, inputCode, userData, docId) {
        const realCode = userData.studentCode || userData.code || userData.examCode || inputCode;
        const studentPhone = userData.phone || userData.studentPhone || userData.mobile || "";

        localStorage.setItem("student_doc_id", docId);
        localStorage.setItem("student_fullname", name);
        localStorage.setItem("student_stage", stage); 
        localStorage.setItem("student_code", realCode);
        localStorage.setItem("exam_code", realCode);
        localStorage.setItem("student_phone", studentPhone);

        // إظهار شاشة الانيميشن الخاصة بـ "القيصر"
        const splash = document.getElementById("splash-screen");
        const splashSubtext = document.getElementById("splash-user-welcome");
        
        if (splashSubtext) {
            splashSubtext.innerText = `أهلاً بك يا ${name}.. جاري تجهيز منصتك!`;
        }
        
        if (splash) {
            splash.style.display = "flex";
        }

        // تحويل الطالب بعد 2.2 ثانية لرؤية الأنيميشن
        setTimeout(() => {
            window.location.href = "platform.html";
        }, 2200);
    }

    document.getElementById("login-form").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const loginBtn = document.getElementById("login-btn");
        const nameInput = document.getElementById("login-name").value.trim();
        const codeInput = document.getElementById("login-code").value.trim();

        if (!nameInput || !codeInput) {
            showMessage("⚠️ يرجى كتابة الاسم والكود معاً!", "warning");
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span>جاري التحقق...</span> <i class="fas fa-spinner fa-spin"></i>';

        try {
            const snapshot = await findStudentDoc(codeInput);

            if (snapshot.empty) {
                showMessage("❌ كود الدخول غير صحيح أو غير مسجل لدى المعلم!", "error");
                resetButton(loginBtn);
                return;
            }

            let studentFound = false;

            snapshot.forEach(doc => {
                const userData = doc.data();
                const storedName = (userData.studentName || userData.name || userData.fullname || "").trim();
                const stage = userData.stage || userData.grade || userData.studentStage || "غير محدد";

                studentFound = true;
                proceedToLogin(storedName || nameInput, stage, codeInput, userData, doc.id);
            });

            if (!studentFound) {
                showMessage("❌ لم يتم العثور على بيانات هذا الطالب!", "error");
                resetButton(loginBtn);
            }

        } catch (error) {
            console.error("خطأ أثناء تسجيل الدخول:", error);
            
            if (error.code === 'permission-denied') {
                showMessage("❌ خطأ: قواعد الأمان في فايرسبور (Firestore Rules) ترفض القراءة. يرجى ضبط القواعد في لوحة تحكم Firebase.", "error");
            } else {
                showMessage("❌ حدث خطأ أثناء الاتصال بقاعدة البيانات. تأكد من اتصالك بالإنترنت.", "error");
            }
            
            resetButton(loginBtn);
        }
    });
</script>
</body>
</html>
