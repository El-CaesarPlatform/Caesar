<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة القيصر</title>

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px 0;
        }

        #hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ------------------ شريط الأخبار ------------------ */
        .news-ticker {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.6);
            border-radius: 30px;
            padding: 12px 24px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 720px;
            width: 95%;
            color: #fff;
            animation: glowing-border 2.5s infinite ease-in-out;
        }

        .news-badge {
            background: linear-gradient(90deg, #00d2ff, #0066ff);
            color: #fff;
            padding: 5px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
            flex-shrink: 0;
        }

        .news-text {
            color: #e0f7fc;
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.5;
            white-space: normal;
        }

        @keyframes glowing-border {
            0% { box-shadow: 0 0 8px rgba(0, 210, 255, 0.3), inset 0 0 5px rgba(0, 210, 255, 0.2); border-color: rgba(0, 210, 255, 0.4); }
            50% { box-shadow: 0 0 22px rgba(0, 210, 255, 0.85), inset 0 0 10px rgba(0, 210, 255, 0.4); border-color: rgba(0, 210, 255, 1); }
            100% { box-shadow: 0 0 8px rgba(0, 210, 255, 0.3), inset 0 0 5px rgba(0, 210, 255, 0.2); border-color: rgba(0, 210, 255, 0.4); }
        }

        .brand-title {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 25px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            text-align: center;
        }

        .brand-title span { color: #00d2ff; }

        .login-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .form-header {
            color: #00d2ff;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #custom-alert-msg {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            white-space: pre-line;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: right;
        }

        .login-container input:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .login-container input::placeholder { color: #ccc; }
        
        #login-code { text-align: center; letter-spacing: 1px; }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d2ff, #0066ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 102, 255, 0.3);
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(90deg, #0066ff, #00d2ff);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.5);
            transform: scale(1.02);
        }
        
        .btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
            transform: scale(1);
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #25d366;
            color: #fff;
            border-radius: 35px;
            padding: 10px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .whatsapp-float:hover {
            transform: scale(1.05);
            background-color: #20ba5a;
        }

        .whatsapp-float svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding-top: 20px; }
            .brand-title { font-size: 1.9rem; }
            .login-container { padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div id="hero">
    <div class="news-ticker">
        <span class="news-badge">📢 تنبيه</span>
        <span class="news-text">أدخل اسمك كما هو مسجل لدى المعلم والكود الخاص بك للدخول.</span>
    </div>

    <h1 class="brand-title">منصة <span>القيصر</span> التعليمية</h1>

    <div class="login-container">
        <div class="form-header">
            <i class="fas fa-user-graduate"></i>
            <span>تسجيل دخول الطالب</span>
        </div>

        <div id="custom-alert-msg"></div>

        <!-- نموذج التسجيل -->
        <form id="login-form">
            <div class="input-group">
                <input type="text" id="login-name" placeholder="اكتب اسمك كاملاً..." required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="text" id="login-code" placeholder="أدخل كود الدخول..." required autocomplete="off">
            </div>
            
            <button type="submit" class="btn" id="login-btn">دخول المنصة <i class="fas fa-sign-in-alt"></i></button>
        </form>
    </div>
</div>

<a href="https://wa.me/201150220788?text=مرحباً، أحتاج المساعدة في منصة القيصر." class="whatsapp-float" target="_blank" rel="noopener noreferrer">
    <span>الدعم الفني</span>
    <svg viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.742.002-2.602-1.01-5.05-2.85-6.892-1.84-1.842-4.29-2.856-6.896-2.858-5.442 0-9.866 4.372-9.746-.002 1.767.46 3.493 1.34 5.023l-.986 3.6 3.69-.968zm13.695-4.937c-.3-.149-1.777-.862-2.053-.962-.276-.1-.477-.149-.677.149-.199.299-.772.962-.947 1.16-.175.201-.35.226-.65.077-1.156-.573-1.928-1.012-2.693-2.316-.201-.341.201-.316.574-1.053.063-.125.032-.236-.016-.336-.048-.1-.477-1.136-.654-1.557-.172-.41-.347-.354-.477-.36l-.408-.008c-.141 0-.368.052-.56.26-.192.208-.733.706-.733 1.722 0 1.017.749 2.002.853 2.141.104.14 1.474 2.227 3.57 3.102.499.208.887.332 1.192.427.502.158.96.135 1.321.082.404-.06 1.777-.716 2.028-1.408.251-.692.251-1.284.175-1.408-.075-.124-.275-.199-.575-.349z"/>
    </svg>

<script>
    // ==========================================
    // 1. تهيئة Firebase
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDSaHZfMovOtZVkv5HDtfsy4Kh_ttszSLI",
        authDomain: "el-kaiser-platform.firebaseapp.com",
        projectId: "el-kaiser-platform",
        storageBucket: "el-kaiser-platform.firebasestorage.app",
        messagingSenderId: "639617459641",
        appId: "1:639617459641:web:7804a357079b1b559c4268"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // إظهار رسائل التنبيه
    function showMessage(text, type) {
        const msgBox = document.getElementById("custom-alert-msg");
        if (!msgBox) return;

        msgBox.innerText = text;
        msgBox.style.display = "block";

        if (type === "error") {
            msgBox.style.backgroundColor = "rgba(255, 0, 0, 0.2)";
            msgBox.style.color = "#ff6b6b";
            msgBox.style.border = "1px solid rgba(255, 0, 0, 0.4)";
        } else if (type === "success") {
            msgBox.style.backgroundColor = "rgba(0, 255, 100, 0.2)";
            msgBox.style.color = "#22c55e";
            msgBox.style.border = "1px solid rgba(0, 255, 100, 0.4)";
        } else if (type === "warning") {
            msgBox.style.backgroundColor = "rgba(234, 179, 8, 0.2)";
            msgBox.style.color = "#fde047";
            msgBox.style.border = "1px solid rgba(234, 179, 8, 0.4)";
        }
    }

    // ==========================================
    // 2. البحث عن الطالب (يدعم النص والرقم)
    // ==========================================
    async function findStudentDoc(code) {
        let snapshot = await db.collection("students").where("examCode", "==", code).get();
        if (snapshot.empty) {
            snapshot = await db.collection("students").where("code", "==", code).get();
        }
        if (snapshot.empty) {
            snapshot = await db.collection("students").where("studentCode", "==", code).get();
        }

        if (snapshot.empty && !isNaN(code)) {
            const numericCode = Number(code);
            snapshot = await db.collection("students").where("examCode", "==", numericCode).get();
            if (snapshot.empty) {
                snapshot = await db.collection("students").where("code", "==", numericCode).get();
            }
            if (snapshot.empty) {
                snapshot = await db.collection("students").where("studentCode", "==", numericCode).get();
            }
        }
        return snapshot;
    }

    // ==========================================
    // 3. عملية تسجيل الدخول المحدثة والآمنة
    // ==========================================
    document.getElementById("login-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const btn = document.getElementById("login-btn");
        const studentName = document.getElementById("login-name").value.trim();
        const inputCode = document.getElementById("login-code").value.trim();

        if (!studentName || !inputCode) {
            showMessage("⚠️ يرجى كتابة اسمك وكود الدخول!", "error");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = 'جاري التحقق... <i class="fas fa-spinner fa-spin"></i>';
        showMessage("⏳ جاري التحقق من البيانات...", "warning");

        try {
            const snapshot = await findStudentDoc(inputCode);

            if (snapshot.empty) {
                showMessage("❌ كود الدخول غير صحيح! تأكد من الكود المكتوب.", "error");
                resetButton(btn);
                return;
            }

            let userData = null;
            let docId = null;

            snapshot.forEach(doc => { 
                userData = doc.data(); 
                docId = doc.id;
            });

            // 1. التحقق من حالة الحساب (هل هو محظور أو غير مفعّل)
            if (userData.active === false || userData.status === "blocked" || userData.status === "rejected") {
                showMessage("⚠️ هذا الكود غير مفعّل حالياً أو تم حظر الحساب.", "warning");
                resetButton(btn);
                return;
            }

            // 2. التحقق من مطابقة الاسم المدخل مع الاسم المسجل في قاعدة البيانات
            const registeredName = (userData.studentName || userData.name || "").trim();
            
            if (registeredName) {
                // إزالة المسافات الزائدة بين الكلمات للمقارنة بشكل دقيق
                const cleanInputName = studentName.replace(/\s+/g, ' ').trim();
                const cleanDbName = registeredName.replace(/\s+/g, ' ').trim();

                if (cleanInputName !== cleanDbName) {
                    showMessage("❌ الاسم غير مطابق للكود المسجل! يرجى كتابة اسمك كما تم تسجيله من المعلم.", "error");
                    resetButton(btn);
                    return;
                }
            }

            const studentStage = userData.stage || userData.grade || "غير محدد";

            // إكمال الدخول باستخدام الاسم المسجل رسمياً
            proceedToLogin(registeredName || studentName, studentStage, inputCode, userData, docId);

        } catch (err) {
            showMessage("❌ حدث خطأ أثناء الاتصال: " + err.message, "error");
            resetButton(btn);
        }
    });

    function resetButton(btn) {
        btn.disabled = false;
        btn.innerHTML = 'دخول المنصة <i class="fas fa-sign-in-alt"></i>';
    }

    function proceedToLogin(name, stage, inputCode, userData, docId) {
        const realCode = userData.studentCode || userData.code || userData.examCode || inputCode;
        const studentPhone = userData.phone || userData.studentPhone || userData.mobile || "";

        localStorage.setItem("student_doc_id", docId);
        localStorage.setItem("student_fullname", name);
        localStorage.setItem("student_stage", stage); 
        localStorage.setItem("student_code", realCode);
        localStorage.setItem("exam_code", realCode);
        localStorage.setItem("student_phone", studentPhone);

        showMessage(`✅ أهلاً بك يا ${name}\nالصف: ${stage}\nجاري تحويلك للمنصة...`, "success");

        setTimeout(() => {
            window.location.href = "platform.html";
        }, 1200);
    }
</script>
</body>
